name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: >-
          python -m compileall -q __init__.py demangler.py integration rtti
          tools tests
      - name: Validate plugin manifest
        run: python -m json.tool plugin.json >/dev/null
      - name: Run license-free tests
        run: python tests/run_pure.py
      - name: Check evaluator command lines
        run: |
          python tools/evaluate.py --help >/dev/null
          python tools/fpceval.py --help >/dev/null
          python tools/bpleval.py --help >/dev/null
